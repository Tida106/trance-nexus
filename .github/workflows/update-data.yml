name: Update Trance Data

on:
  schedule:
    # 毎日 03:00 UTC に実行
    - cron: '0 3 * * *'
  # 手動実行ボタン
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run scrapers
        run: |
          node scrapers/scrape-radio.js
          node scrapers/scrape-setlists.js
          node scrapers/scrape-events.js
        continue-on-error: true

      - name: Post to X
        run: node scrapers/post-x.js
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        continue-on-error: true

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet data/; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push updated data
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config user.name "trance-nexus-bot"
          git config user.email "bot@trance-nexus.local"
          git add data/
          git commit -m "chore: auto-update data $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          git push
