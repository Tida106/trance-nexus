name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Must run before build so base_path output is available
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      # `npm run build` runs the full chain:
      #   1. prebuild  — generate-og-images / sitemap / search-index / rss / pwa
      #   2. verify:artist-links  — strict-TLS GET on every URL in
      #      data/artists/*.links — fails the build on any 4xx/5xx,
      #      SSL error, or DNS NXDOMAIN.
      #   3. verify:amazon-asins  — GET amazon.{co.jp|com}/dp/<ASIN> for
      #      every ASIN in data/blog/products.js — fails on 4xx/5xx or
      #      Amazon's "page not found" body marker.
      #   4. next build           — only runs if both verifiers pass.
      # Both verifiers persist their output to logs/verify-*.log so a
      # failure leaves a postmortem behind. The "Upload verification
      # logs" step below ships those files as an artifact when the
      # build step fails.
      - name: Build static export
        run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          # 6 GB heap — the static export prerenders 168+ pages and the
          # blog post tree imports several large data modules; 4 GB
          # OOMed on a local repro. GitHub-hosted ubuntu runners have
          # ~7 GB total RAM available, so 6 GB still leaves headroom.
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Upload verification logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verification-logs
          path: logs/verify-*.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Ping Google Search Console
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://www.google.com/ping?sitemap=https%3A%2F%2Ftrance-nexus.com%2Fsitemap.xml")
          echo "Google ping status: $STATUS"
        continue-on-error: true
