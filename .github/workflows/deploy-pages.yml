name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Must run before build so base_path output is available
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      # CI uses `build:fast` (skip-the-gate variant) instead of `build`.
      # Reason: the gate's external-URL verifiers (Amazon, SoundCloud,
      # Spotify) get rate-limited or selectively 503'd from GitHub
      # Actions IP ranges, which produced false-positive build
      # failures on otherwise-healthy commits and left the live site
      # serving the previous artifact (or worse, falling back to the
      # branch-source "deploy from main" flow that serves stray root
      # files). The gate stays enforced locally via `npm run build`
      # and developer discipline; CI just builds and deploys.
      #
      # The chain is still:
      #   1. prebuild  — generate-og-images / sitemap / search-index / rss / pwa
      #   2. next build (via build:fast)
      #
      # Verification is a pre-push check, not a CI gate, until we
      # work out a strategy that's not flaky against CI IP ranges
      # (e.g. mocking the verifier URLs from a known-good cache, or
      # running verifiers from a separate scheduled job).
      - name: Build static export
        run: npm run build:fast
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          # Google Analytics 4 Measurement ID. Public by design (it ends
          # up in every visitor's HTML), so a hardcoded fallback is safe
          # and means deploys keep working if the secret is unset or
          # rotated. Override via repo secret if needed.
          NEXT_PUBLIC_GA_ID: ${{ secrets.NEXT_PUBLIC_GA_ID || 'G-QFN44JD527' }}
          # 6 GB heap — the static export prerenders 168+ pages and the
          # blog post tree imports several large data modules; 4 GB
          # OOMed on a local repro. GitHub-hosted ubuntu runners have
          # ~7 GB total RAM available, so 6 GB still leaves headroom.
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Upload verification logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verification-logs
          path: logs/verify-*.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Ping Google Search Console
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://www.google.com/ping?sitemap=https%3A%2F%2Ftrance-nexus.com%2Fsitemap.xml")
          echo "Google ping status: $STATUS"
        continue-on-error: true
