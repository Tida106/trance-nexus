<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 178" role="img">
  <title>Trance Nexus</title>
  <defs>
    <linearGradient id="cg" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#ECEEF5"/>
      <stop offset="100%" stop-color="#B4BAC8"/>
    </linearGradient>
    <clipPath id="mc">
      <circle cx="88" cy="88" r="36"/>
    </clipPath>
  </defs>

  <!-- Outer radar ring -->
  <circle cx="88" cy="88" r="53" fill="none" stroke="#B8BED0" stroke-width="0.7" stroke-dasharray="3 5" opacity="0.7"/>
  <line x1="88" y1="31" x2="88" y2="37" stroke="#B8BED0" stroke-width="1.2"/>
  <line x1="88" y1="139" x2="88" y2="145" stroke="#B8BED0" stroke-width="1.2"/>
  <line x1="33" y1="88" x2="39" y2="88" stroke="#B8BED0" stroke-width="1.2"/>

  <!-- Orbit rings -->
  <ellipse cx="88" cy="88" rx="64" ry="19" fill="none" stroke="#7B8DB8" stroke-width="1.3" opacity="0.55" transform="rotate(-30 88 88)"/>
  <ellipse cx="88" cy="88" rx="64" ry="19" fill="none" stroke="#9098B8" stroke-width="1.3" opacity="0.55" transform="rotate(30 88 88)"/>

  <!-- Metal ring (bevel) -->
  <circle cx="88" cy="88" r="40" fill="none" stroke="#9098B0" stroke-width="3.5"/>
  <circle cx="88" cy="88" r="38" fill="none" stroke="#DDE2EE" stroke-width="1.5"/>

  <!-- Chrome fill -->
  <circle cx="88" cy="88" r="37" fill="url(#cg)"/>

  <!-- Frequency bars -->
  <g clip-path="url(#mc)">
    <rect x="62" y="77" width="7" height="22" rx="3.5" fill="#5BA8FF" opacity="0.85"/>
    <rect x="73" y="69" width="7" height="38" rx="3.5" fill="#4090F0"/>
    <rect x="84" y="62" width="7" height="52" rx="3.5" fill="#2B7EE0"/>
    <rect x="95" y="69" width="7" height="38" rx="3.5" fill="#4090F0"/>
    <rect x="106" y="77" width="7" height="22" rx="3.5" fill="#5BA8FF" opacity="0.85"/>
  </g>

  <!-- Orbit nodes -->
  <circle cx="88" cy="52" r="4.5" fill="#D4A930"/>
  <circle cx="88" cy="124" r="4.5" fill="#C09020"/>
  <circle cx="24" cy="88" r="2.5" fill="#9098B8" opacity="0.8"/>
  <circle cx="152" cy="88" r="2.5" fill="#9098B8" opacity="0.8"/>

  <!-- Circuit trace -->
  <line x1="141" y1="88" x2="162" y2="88" stroke="#9098B8" stroke-width="1.2"/>
  <line x1="162" y1="88" x2="162" y2="56" stroke="#9098B8" stroke-width="1.2"/>
  <line x1="162" y1="56" x2="174" y2="56" stroke="#9098B8" stroke-width="1.2"/>
  <circle cx="162" cy="88" r="2.5" fill="#9098B8"/>
  <circle cx="162" cy="56" r="3" fill="#D4A930"/>

  <!-- Status readout -->
  <text x="177" y="51" font-family="'Courier New',monospace" font-size="9" fill="#7880A4" letter-spacing="1.5">SIG:0xF7A2 · BPM:138 · STATUS:ONLINE</text>

  <!-- TRANCE -->
  <text x="177" y="98"
    font-family="'Trebuchet MS',Arial,sans-serif"
    font-size="50" font-weight="900" letter-spacing="3"
    fill="#B88818">TRANCE</text>

  <!-- NEXUS -->
  <text x="181" y="130"
    font-family="'Trebuchet MS',Arial,sans-serif"
    font-size="24" font-weight="300" letter-spacing="17"
    fill="#5B6898">NEXUS</text>

  <!-- Rule + ticks -->
  <line x1="177" y1="141" x2="422" y2="141" stroke="#9098B8" stroke-width="0.8" opacity="0.7"/>
  <line x1="177" y1="136" x2="177" y2="146" stroke="#9098B8" stroke-width="2"/>
  <line x1="422" y1="136" x2="422" y2="146" stroke="#D4A930" stroke-width="2"/>

  <!-- MUSIC PORTAL -->
  <text x="179" y="157" font-family="'Courier New',monospace" font-size="9.5" fill="#7880A4" letter-spacing="4">MUSIC PORTAL</text>

  <!-- HUD brackets -->
  <path d="M175,43 L163,43 L163,59" fill="none" stroke="#9098B8" stroke-width="1.8" stroke-linecap="square"/>
  <path d="M424,149 L436,149 L436,133" fill="none" stroke="#D4A930" stroke-width="1.8" stroke-linecap="square"/>
</svg>
